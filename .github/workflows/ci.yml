name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub runners have no GPU, so the device tests need a software OpenCL
      # implementation. pocl is a CPU ICD: it reports a real platform, builds real
      # kernels and supports the fp32 + local-memory reduction this library emits.
      # ocl-icd-opencl-dev, not ocl-icd-libopencl1: JOCL dlopen()s the unversioned
      # "libOpenCL.so", which only the -dev package's symlink provides. The runtime
      # package alone ships libOpenCL.so.1 and the load fails.
      - name: Install a CPU OpenCL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y pocl-opencl-icd ocl-icd-opencl-dev clinfo
          clinfo --list

      - name: Report what the device actually supports
        run: ./mill spireOpencl.runMain io.github.mercurievv.spireopencl.opencl.DeviceProbe

      # POCL_KERNEL_CACHE=0: pocl caches compiled kernels in a shared directory and
      # races with itself when two test JVMs build a program at the same time --
      # "unable to rename temporary ... No such file or directory". Nothing to do
      # with the emitted kernel; the cache is just shared mutable state we don't need.
      - name: Test
        run: ./mill spireOpencl.test
        env:
          POCL_KERNEL_CACHE: '0'

  publish:
    name: Publish to Maven Central
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The tag is the version: publishVersion reads GITHUB_REF_NAME.
      - name: Publish
        run: ./mill spireOpencl.publishSonatypeCentral
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
