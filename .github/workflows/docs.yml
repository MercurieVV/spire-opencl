name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mdoc-docs/**'
      - 'bench/results/**'
      - 'build.mill'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

# Reusable-workflow permissions are the intersection of caller and callee: docs-build.yml requests
# pages/id-token, but that's a ceiling, not a grant -- the caller has to grant them too, or they're
# silently capped at the repo default (none), which fails the run at startup.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/docs-build.yml
