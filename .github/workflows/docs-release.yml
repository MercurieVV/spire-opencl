name: Docs (release)

# Deliberately no `paths` filter, unlike docs.yml: a release tag doesn't touch docs/**, but
# build.mill's latestReleaseVersion reads the git tag list, not a file diff, so the version shown in
# the site's setup instructions changes on every tag regardless of what files that push touched. A
# path filter here would skip exactly the rebuild this exists for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# See docs.yml: reusable-workflow permissions are the intersection of caller and callee, so this has
# to grant the same set docs-build.yml requests, not just declare it there.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/docs-build.yml
