name: Build and deploy docs site

# Reusable: called by docs.yml (master pushes that touch docs/**) and docs-release.yml (every release tag, no path
# filter — see that file for why). One job definition so the two triggers can't drift apart.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 — checkout's default is a shallow, tag-less clone, and
      # build.mill's latestReleaseVersion reads `git tag --list`; without full history
      # that call sees no tags at all and silently falls back to 0.1.0-SNAPSHOT.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build site
        run: ./mill docs.site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/docs/site.dest

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
